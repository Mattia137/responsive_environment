<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALLSPARK // IMPACT — Direction B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: 'DM Sans', sans-serif; }

    :root {
      /* Backgrounds */
      --bg-map:    #ffffff;
      --bg-panel:  oklch(98.5% 0.004 60);
      --bg-panel2: oklch(96.5% 0.006 58);
      --bg-panel3: oklch(94% 0.008 56);

      /* Ink hierarchy */
      --ink-1: oklch(18% 0.008 50);
      --ink-2: oklch(36% 0.008 50);
      --ink-3: oklch(55% 0.008 50);
      --ink-4: oklch(70% 0.008 50);

      /* Lines */
      --ln-1: oklch(92% 0.005 55);
      --ln-2: oklch(86% 0.007 54);
      --ln-3: oklch(78% 0.009 53);

      /* Accent — vermillion */
      --red:       oklch(58% 0.20 28);
      --red-dim:   oklch(70% 0.12 28);
      --red-ghost: oklch(95% 0.04 28);

      /* Layer category colors */
      --c-env: oklch(55% 0.14 148);
      --c-eco: oklch(52% 0.14 248);
      --c-log: oklch(54% 0.14 32);

      /* Status */
      --pos: oklch(50% 0.14 148);
      --neg: oklch(50% 0.16 22);
      --neu: oklch(52% 0.14 80);

      /* Shadows */
      --sh-1: 0 1px 3px rgba(0,0,0,0.06);
      --sh-2: 0 4px 16px rgba(0,0,0,0.09);

      /* Layout */
      --hdr-h: 52px;
      --lpanel-w: 272px;
      --rpanel-w: 296px;
      --footer-h: 30px;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── LAYER DATA ── */
const LAYERS = {
  env: {
    label: "Environment", color: "var(--c-env)",
    items: [
      { id:"solar",  name:"Solar Exposure",  swatch:"#e8b84b", delta:"+14%", on:true,  val:"4.2 kWh/m²/d" },
      { id:"wind",   name:"Wind Flow",        swatch:"#7bb8d4", delta:"-3%",  on:true,  val:"3.1 m/s" },
      { id:"veg",    name:"Green Coverage",   swatch:"#7dc47d", delta:"+8%",  on:false, val:"18%" },
      { id:"heat",   name:"Urban Heat",       swatch:"#d4845a", delta:"+11%", on:false, val:"+2.4°C" },
    ]
  },
  eco: {
    label: "Economic", color: "var(--c-eco)",
    items: [
      { id:"energy",  name:"Energy Demand",  swatch:"#6dbf9e", delta:"+22%", on:true,  val:"2.1 MW" },
      { id:"carbon",  name:"Carbon Output",  swatch:"#c46060", delta:"+18%", on:true,  val:"890 t/yr" },
      { id:"water",   name:"Water Use",      swatch:"#6090d4", delta:"+6%",  on:false, val:"340 m³/d" },
    ]
  },
  log: {
    label: "Logistics & Air", color: "var(--c-log)",
    items: [
      { id:"air",    name:"Air Quality",    swatch:"#70c8d8", delta:"-9%",  on:true,  val:"AQI 42" },
      { id:"bio",    name:"Biodiversity",   swatch:"#b07ad8", delta:"-4%",  on:false, val:"0.61 BII" },
      { id:"shadow", name:"Shadow Cast",    swatch:"#9aa0a8", delta:"—",    on:false, val:"—" },
    ]
  }
};

const SCRUB_STEPS = [
  { label: "BASELINE", sub: "T0" },
  { label: "BUILD",    sub: "T1" },
  { label: "OPEN",     sub: "+1Y" },
  { label: "SETTLED",  sub: "+5Y" },
  { label: "HORIZON",  sub: "+20Y" },
];

/* ── ICONS ── */
const Ic = ({ d, size=14, stroke=1.5 }) => (
  <svg width={size} height={size} viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">
    <path d={d}/>
  </svg>
);

const IconLayers  = () => <Ic d="M10 3L2 7.5 10 12 18 7.5z M2 12l8 4.5 8-4.5" />;
const IconMassing = () => <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="5" y="9" width="10" height="9"/><path d="M5 9l5-6 5 6"/></svg>;
const IconImpact  = () => <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="3,14 7,9 11,12 17,6"/></svg>;
const IconSearch  = () => <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.6"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/></svg>;
const IconChevron = ({ open }) => (
  <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" strokeWidth="1.4">
    {open ? <polyline points="2,7 5,4 8,7"/> : <polyline points="2,4 5,7 8,4"/>}
  </svg>
);
const IconClose = () => <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" strokeWidth="1.4"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>;
const IconInfo = () => <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="10" cy="10" r="8"/><line x1="10" y1="9" x2="10" y2="14"/><circle cx="10" cy="6.5" r="0.5" fill="currentColor" stroke="none"/></svg>;

/* ── MAP PLACEHOLDER ── */
const MapPlaceholder = () => (
  <div style={{
    position:'absolute', inset:0,
    background: `
      linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px)
    `,
    backgroundSize: '32px 32px',
    backgroundColor: 'var(--bg-map)',
  }}>
    {/* Subtle topo rings */}
    <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:0.07}} viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
      {[80,130,180,230,280].map(r=>(
        <ellipse key={r} cx="420" cy="320" rx={r*1.5} ry={r} fill="none" stroke="#444" strokeWidth="0.8"/>
      ))}
      {[60,100,140,180].map(r=>(
        <ellipse key={r} cx="220" cy="240" rx={r} ry={r*0.7} fill="none" stroke="#444" strokeWidth="0.8"/>
      ))}
      {/* street-like lines */}
      <line x1="0" y1="300" x2="800" y2="310" stroke="#444" strokeWidth="1.2"/>
      <line x1="200" y1="0" x2="220" y2="600" stroke="#444" strokeWidth="1.2"/>
      <line x1="500" y1="0" x2="480" y2="600" stroke="#444" strokeWidth="0.8"/>
      <line x1="0" y1="150" x2="800" y2="180" stroke="#444" strokeWidth="0.8"/>
      <line x1="0" y1="450" x2="800" y2="430" stroke="#444" strokeWidth="0.8"/>
      <rect x="340" y="260" width="120" height="90" fill="rgba(0,0,0,0.04)" stroke="#444" strokeWidth="0.6"/>
      <rect x="380" y="280" width="50" height="45" fill="var(--red-ghost)" stroke="var(--red-dim)" strokeWidth="1"/>
    </svg>
  </div>
);

/* ── TIME SCRUBBER ── */
const TimeScrubber = ({ step, onStep }) => {
  const pct = (step / (SCRUB_STEPS.length - 1)) * 100;
  return (
    <div style={{flex:1, display:'flex', alignItems:'center', padding:'0 32px', position:'relative', height:'100%', minWidth:0}}>
      {/* track */}
      <div style={{position:'absolute', top:'50%', left:32, right:32, height:1, background:'var(--ln-2)', transform:'translateY(-50%)'}}>
        <div style={{position:'absolute', left:0, width:`${pct}%`, height:'100%', background:'var(--red)'}} />
      </div>
      {/* steps */}
      <div style={{width:'100%', display:'flex', justifyContent:'space-between', position:'relative', zIndex:2}}>
        {SCRUB_STEPS.map((s,i) => {
          const active = i === step;
          const filled = i < step;
          return (
            <div key={s.label} onClick={()=>onStep(i)}
                 style={{display:'flex',flexDirection:'column',alignItems:'center',cursor:'pointer',gap:0}}>
              <span style={{
                fontSize:8, letterSpacing:'0.12em', textTransform:'uppercase',
                color: active ? 'var(--red)' : 'var(--ink-4)',
                fontWeight: active ? 600 : 400,
                marginBottom:5, whiteSpace:'nowrap',
              }}>{s.label}</span>
              <div style={{
                width:11, height:11, borderRadius:'50%',
                background: active ? 'var(--red)' : filled ? 'var(--bg-panel)' : 'var(--bg-panel)',
                border: `1.5px solid ${active ? 'var(--red)' : filled ? 'var(--red)' : 'var(--ln-3)'}`,
                boxShadow: active ? '0 0 0 3px var(--red-ghost)' : 'none',
                transition: 'all 0.15s',
              }} />
              <span style={{
                fontSize:8, letterSpacing:'0.08em', color:'var(--ink-4)', marginTop:5,
                fontFamily:"'DM Mono', monospace", whiteSpace:'nowrap',
              }}>{s.sub}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ── HEADER ── */
const Header = ({ mode, onMode, step, onStep, lpanelOpen, rpanelOpen, onToggleL, onToggleR }) => (
  <header style={{
    position:'absolute', top:0, left:0, right:0, height:'var(--hdr-h)',
    background:'var(--bg-panel)',
    borderBottom:'1px solid var(--ln-1)',
    display:'flex', alignItems:'stretch',
    zIndex:30,
  }}>
    {/* Brand */}
    <div style={{
      display:'flex', alignItems:'center', padding:'0 20px', gap:6,
      borderRight:'1px solid var(--ln-1)', flexShrink:0,
    }}>
      <span style={{fontSize:12,fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--ink-1)'}}>ALLSPARK</span>
      <span style={{color:'var(--red)',fontWeight:400,fontSize:14,lineHeight:1,margin:'0 1px'}}>//</span>
      <span style={{fontSize:12,fontWeight:300,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--ink-3)'}}>IMPACT</span>
    </div>

    {/* Mode toggle */}
    <div style={{display:'flex', alignItems:'center', padding:'0 14px', gap:3, borderRight:'1px solid var(--ln-1)', flexShrink:0}}>
      {["layers","massing","impact"].map(m => (
        <button key={m} onClick={()=>onMode(m)} style={{
          padding:'5px 14px', fontSize:10, letterSpacing:'0.1em', textTransform:'uppercase',
          cursor:'pointer', background: mode===m ? 'var(--red-ghost)' : 'transparent',
          border: `1px solid ${mode===m ? 'var(--red-dim)' : 'transparent'}`,
          color: mode===m ? 'var(--red)' : 'var(--ink-3)',
          fontWeight: mode===m ? 500 : 400,
          borderRadius:3, fontFamily:"'DM Sans', sans-serif",
          transition:'all 0.12s',
        }}>{m}</button>
      ))}
    </div>

    {/* Scrubber */}
    <TimeScrubber step={step} onStep={onStep} />

    {/* Search + meta */}
    <div style={{display:'flex', alignItems:'center', gap:12, padding:'0 16px', borderLeft:'1px solid var(--ln-1)', flexShrink:0}}>
      <div style={{
        display:'flex', alignItems:'center', gap:8,
        background:'var(--bg-panel2)', border:'1px solid var(--ln-2)',
        padding:'5px 10px', minWidth:160,
      }}>
        <IconSearch />
        <span style={{fontSize:10,color:'var(--ink-4)',letterSpacing:'0.05em'}}>Search location…</span>
      </div>
      <div style={{display:'flex', alignItems:'center', gap:5, fontSize:9, letterSpacing:'0.1em', color:'var(--ink-4)', textTransform:'uppercase'}}>
        <div style={{width:5,height:5,borderRadius:'50%',background:'var(--red)',animation:'blink 2.4s ease infinite'}} />
        LIVE
      </div>
      {/* panel toggles */}
      <button onClick={onToggleL} title="Toggle left panel" style={{
        width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',
        border:`1px solid ${lpanelOpen?'var(--red-dim)':'var(--ln-2)'}`,
        background:lpanelOpen?'var(--red-ghost)':'transparent',
        color:lpanelOpen?'var(--red)':'var(--ink-3)',
        cursor:'pointer',borderRadius:2,
      }}>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.4">
          <rect x="1" y="1" width="10" height="10" rx="1"/>
          <line x1="4" y1="1" x2="4" y2="11"/>
        </svg>
      </button>
      <button onClick={onToggleR} title="Toggle right panel" style={{
        width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',
        border:`1px solid ${rpanelOpen?'var(--red-dim)':'var(--ln-2)'}`,
        background:rpanelOpen?'var(--red-ghost)':'transparent',
        color:rpanelOpen?'var(--red)':'var(--ink-3)',
        cursor:'pointer',borderRadius:2,
      }}>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.4">
          <rect x="1" y="1" width="10" height="10" rx="1"/>
          <line x1="8" y1="1" x2="8" y2="11"/>
        </svg>
      </button>
    </div>
  </header>
);

/* ── LEFT PANEL ── */
const LeftPanel = ({ open, mode, activeLayers, onToggleLayer }) => {
  const [openCats, setOpenCats] = useState(["env","eco","log"]);
  const [lpTab, setLpTab] = useState("layers");

  const toggleCat = id => setOpenCats(p => p.includes(id)?p.filter(c=>c!==id):[...p,id]);

  const activeCount = Object.values(LAYERS).flatMap(c=>c.items).filter(l=>activeLayers.includes(l.id)).length;

  return (
    <aside style={{
      position:'absolute',
      top:'var(--hdr-h)', left:0, bottom:'var(--footer-h)',
      width: open ? 'var(--lpanel-w)' : 0,
      background:'var(--bg-panel)',
      borderRight:'1px solid var(--ln-1)',
      display:'flex', flexDirection:'column',
      zIndex:20, overflow:'hidden',
      transition:'width 0.22s cubic-bezier(0.4,0,0.2,1)',
    }}>
      <div style={{width:'var(--lpanel-w)', display:'flex', flexDirection:'column', height:'100%', minWidth:0}}>
        {/* Tabs */}
        <div style={{display:'flex', borderBottom:'1px solid var(--ln-1)', flexShrink:0}}>
          {[["layers","Layers"],["program","Program"],["geometry","Geometry"]].map(([id,label])=>(
            <div key={id} onClick={()=>setLpTab(id)} style={{
              flex:1, padding:'9px 4px', textAlign:'center', cursor:'pointer',
              fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
              color: lpTab===id ? 'var(--red)' : 'var(--ink-3)',
              borderBottom: `2px solid ${lpTab===id ? 'var(--red)' : 'transparent'}`,
              fontWeight: lpTab===id ? 500 : 400,
              transition:'all 0.12s',
            }}>{label}</div>
          ))}
        </div>

        {/* Body */}
        <div style={{flex:1, overflowY:'auto', scrollbarWidth:'thin', scrollbarColor:'var(--ln-2) transparent'}}>

          {lpTab === "layers" && (
            <>
              {/* count bar */}
              <div style={{
                display:'flex', alignItems:'center', justifyContent:'space-between',
                padding:'8px 16px 6px', borderBottom:'1px solid var(--ln-1)',
              }}>
                <span style={{fontSize:9,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--ink-4)'}}>Active Layers</span>
                <span style={{fontSize:9,fontFamily:"'DM Mono'",color:'var(--ink-2)',letterSpacing:'0.04em'}}>{activeCount} / 10</span>
              </div>

              {Object.entries(LAYERS).map(([catId, cat])=>{
                const isOpen = openCats.includes(catId);
                const onCount = cat.items.filter(l=>activeLayers.includes(l.id)).length;
                return (
                  <div key={catId} style={{borderBottom:'1px solid var(--ln-1)'}}>
                    {/* category header */}
                    <div onClick={()=>toggleCat(catId)} style={{
                      display:'flex', alignItems:'center', gap:9,
                      padding:'9px 16px', cursor:'pointer', background:'var(--bg-panel2)',
                      transition:'background 0.1s',
                    }}>
                      <div style={{width:7,height:7,borderRadius:'50%',background:cat.color,flexShrink:0}} />
                      <span style={{fontSize:9,letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--ink-2)',fontWeight:600,flex:1}}>{cat.label}</span>
                      <span style={{fontSize:8,color:'var(--ink-4)',fontFamily:"'DM Mono'"}}>{onCount}/{cat.items.length}</span>
                      <div style={{color:'var(--ink-4)',marginLeft:4}}>
                        <IconChevron open={isOpen}/>
                      </div>
                    </div>

                    {/* layer rows */}
                    {isOpen && cat.items.map(lyr => {
                      const on = activeLayers.includes(lyr.id);
                      const isPos = lyr.delta.startsWith('+');
                      const isNeg = lyr.delta.startsWith('-');
                      return (
                        <div key={lyr.id} onClick={()=>onToggleLayer(lyr.id)}
                             style={{
                               display:'flex', alignItems:'center', gap:9, padding:'7px 16px',
                               cursor:'pointer', background: on ? 'var(--red-ghost)' : 'transparent',
                               borderBottom:'1px solid var(--ln-1)', transition:'background 0.1s',
                             }}>
                          {/* checkbox */}
                          <div style={{
                            width:12, height:12, borderRadius:2, flexShrink:0,
                            border:`1.5px solid ${on ? 'var(--red)' : 'var(--ln-3)'}`,
                            background: on ? 'var(--red)' : 'transparent',
                            display:'flex', alignItems:'center', justifyContent:'center',
                            transition:'all 0.12s',
                          }}>
                            {on && <svg width="7" height="6" viewBox="0 0 7 6"><polyline points="1,3 3,5 6,1" fill="none" stroke="white" strokeWidth="1.2" strokeLinecap="round"/></svg>}
                          </div>
                          {/* swatch */}
                          <div style={{width:7,height:7,borderRadius:'50%',background:lyr.swatch,flexShrink:0}} />
                          {/* name */}
                          <span style={{flex:1,fontSize:10.5,color: on ? 'var(--ink-1)' : 'var(--ink-3)',fontWeight: on ? 500 : 400, transition:'color 0.12s'}}>{lyr.name}</span>
                          {/* val */}
                          <span style={{fontSize:9,color:'var(--ink-4)',fontFamily:"'DM Mono'",letterSpacing:'0.02em'}}>{lyr.val}</span>
                          {/* delta */}
                          <span style={{
                            fontSize:8.5, letterSpacing:'0.04em', fontFamily:"'DM Mono'", minWidth:32, textAlign:'right',
                            color: isPos ? 'var(--neg)' : isNeg ? 'var(--pos)' : 'var(--ink-4)',
                          }}>{lyr.delta}</span>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </>
          )}

          {lpTab === "program" && (
            <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:10}}>
              {[
                ["PROGRAM TYPE", "Museum · Media / Digital"],
                ["GFA m²", "13,750"],
                ["HOURS / WEEK", "60"],
                ["ADMISSION $", "28"],
                ["STAFF", "120"],
              ].map(([label, val])=>(
                <label key={label} style={{display:'flex',flexDirection:'column',gap:4,fontSize:9,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--ink-3)'}}>
                  {label}
                  <div style={{
                    height:30, background:'var(--bg-panel2)', border:'1px solid var(--ln-2)',
                    padding:'0 10px', display:'flex', alignItems:'center',
                    fontSize:11, color:'var(--ink-1)', fontFamily:"'DM Mono'",
                    letterSpacing:'0.02em',
                  }}>{val}</div>
                </label>
              ))}
            </div>
          )}

          {lpTab === "geometry" && (
            <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:12}}>
              <label style={{display:'flex',flexDirection:'column',gap:6,fontSize:9,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--ink-3)'}}>
                RADIUS
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div style={{flex:1,height:3,background:'var(--ln-2)',borderRadius:2,position:'relative'}}>
                    <div style={{position:'absolute',left:0,width:'30%',height:'100%',background:'var(--red)',borderRadius:2}} />
                    <div style={{position:'absolute',left:'30%',width:12,height:12,background:'var(--red)',borderRadius:'50%',top:-5,transform:'translateX(-50%)',boxShadow:'0 0 0 3px var(--red-ghost)'}} />
                  </div>
                  <span style={{fontSize:11,color:'var(--ink-1)',fontFamily:"'DM Mono'",minWidth:50,textAlign:'right'}}>400 m</span>
                </div>
              </label>
              <label style={{display:'flex',flexDirection:'column',gap:4,fontSize:9,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--ink-3)'}}>
                MODE
                <div style={{height:30,background:'var(--bg-panel2)',border:'1px solid var(--ln-2)',padding:'0 10px',display:'flex',alignItems:'center',fontSize:11,color:'var(--ink-1)',fontFamily:"'DM Mono'"}}>
                  EUCLIDEAN
                </div>
              </label>
              <div style={{borderLeft:'2px solid var(--red-dim)',paddingLeft:10,fontSize:9,color:'var(--ink-4)',lineHeight:1.6}}>
                Boundary is an editorial choice, not a measurement.
              </div>
              <div style={{display:'flex',gap:8}}>
                <button style={{flex:1,padding:'8px 0',fontSize:9,letterSpacing:'0.1em',textTransform:'uppercase',background:'transparent',border:'1px solid var(--ln-2)',color:'var(--ink-2)',cursor:'pointer',fontFamily:"'DM Sans'"}}>DRAW POLYGON</button>

/* ── MINI SPARKLINE ── */
const Spark = ({ data, color='var(--red)', height=28 }) => {
  const max = Math.max(...data), min = Math.min(...data);
  const norm = data.map(v=>(v-min)/(max-min||1));
  const w=100,h=height;
  const pts = norm.map((v,i)=>`${(i/(data.length-1))*w},${h-v*(h-4)-2}`).join(' ');
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{display:'block',marginTop:8}}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round"/>
      <polyline points={`0,${h} ${pts} ${w},${h}`} fill={color} opacity="0.08"/>
    </svg>
  );
};

        mode={mode}
